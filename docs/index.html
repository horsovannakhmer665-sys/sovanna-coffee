<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ហាងសុវណ្ណាលក់គ្រឿងកាហ្វេ</title>

<style>
body {
    margin: 0;
    font-family: Arial, "Noto Sans Khmer", sans-serif;
    background: #f5f5f5;
    color: #333;
}

header {
    background: #5b351f;
    color: white;
    padding: 25px;
    text-align: center;
}

header h1 {
    margin: 0;
    font-size: 30px;
}

header p {
    margin: 8px 0 0;
}

.search {
    text-align: center;
    padding: 20px;
}

.search input {
    width: 80%;
    max-width: 500px;
    padding: 14px;
    border: 1px solid #ccc;
    border-radius: 10px;
    font-size: 16px;
}

.products {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
    padding: 20px;
    max-width: 1200px;
    margin: auto;
}

.card {
    background: white;
    border-radius: 15px;
    overflow: hidden;
    box-shadow: 0 3px 10px rgba(0,0,0,0.1);
}

.card img {
    width: 100%;
    height: 200px;
    object-fit: cover;
}

.card-content {
    padding: 15px;
}

.card h2 {
    margin: 0 0 8px;
    font-size: 20px;
}

.category {
    color: #777;
    font-size: 14px;
}

.price {
    color: #b36b00;
    font-size: 20px;
    font-weight: bold;
    margin-top: 10px;
}

.stock {
    margin-top: 8px;
    color: #555;
}

footer {
    margin-top: 30px;
    background: #333;
    color: white;
    text-align: center;
    padding: 20px;
}
</style>
</head>

<body>

<header>
    <h1>🏪 ហាងសុវណ្ណាលក់គ្រឿងកាហ្វេ</h1>
    <p>ទំនិញ និងតម្លៃរបស់ហាង</p>
</header>

<div class="search">
    <input type="text" id="search" placeholder="🔎 ស្វែងរកទំនិញ...">
</div>

<div class="products" id="products">
    <p>កំពុងផ្ទុកទំនិញ...</p>
</div>

<footer>
    © 2026 ហាងសុវណ្ណាលក់គ្រឿងកាហ្វេ
</footer>

<script>
const search = document.getElementById("search");
const products = document.getElementById("products");

let allProducts = [];

function showProducts(list) {
    products.innerHTML = "";

    if (list.length === 0) {
        products.innerHTML = "<p>រកមិនឃើញទំនិញទេ</p>";
        return;
    }

    list.forEach(product => {
        const card = document.createElement("div");
        card.className = "card";

        const image = product.image
            ? "images/" + product.image
            : "";

        card.innerHTML = `
            ${image ? `<img src="${image}" alt="${product.name}">` : ""}
            <div class="card-content">
                <h2>${product.name}</h2>
                <div class="category">${product.category}</div>
                <div class="price">
                    ${Number(product.sell_price).toLocaleString()}៛
            </div>

                <div class="stock">
                                                     ស្តុក: ${product.stock}
            </div>

                <button onclick="orderProduct(${product.id})">
                   🛒 កម្ម៉ង់
                </button>

            </div>
        `;

        products.appendChild(card);
    });
}

fetch("https://sovanna-coffee-api.onrender.com/api/products")
    .then(response => response.json())
    .then(data => {
        allProducts = data;
        showProducts(allProducts);
    })
    .catch(error => {
        products.innerHTML =
            "<p>មិនអាចភ្ជាប់ទៅ Server បានទេ</p>";
        console.error(error);
    });

search.addEventListener("input", function () {
    const text = search.value.toLowerCase();

    const filtered = allProducts.filter(product =>
        product.name.toLowerCase().includes(text) ||
        product.category.toLowerCase().includes(text)
    );

    showProducts(filtered);
});
async function orderProduct(productId) {
    const product = allProducts.find(p => p.id === productId);

    if (!product) {
        alert("រកមិនឃើញទំនិញ");
        return;
    }

    const name = prompt("👤 សូមបញ្ចូលឈ្មោះរបស់អ្នក៖");
    if (!name) return;

    const phone = prompt("📞 សូមបញ្ចូលលេខទូរស័ព្ទ៖");
    if (!phone) return;

    const address = prompt("📍 សូមបញ្ចូលអាសយដ្ឋានដឹកជញ្ជូន៖");
    if (!address) return;

    const quantity = prompt(
        "🔢 សូមបញ្ចូលចំនួន " + product.name + "៖",
        "1"
    );

    if (!quantity) return;

    try {
        const response = await fetch(
            "https://sovanna-coffee-api.onrender.com/api/orders",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    customer_name: name,
                    phone: phone,
                    address: address
                })
            }
        );

        const data = await response.json();

        if (response.ok) {
            alert(
                "✅ កម្ម៉ង់បានទទួល!\n\n" +
                "លេខកម្ម៉ង់: " + data.order_id + "\n" +
                "ទំនិញ: " + product.name + "\n" +
                "ចំនួន: " + quantity + "\n" +
                "ឈ្មោះ: " + name + "\n" +
                "ទូរស័ព្ទ: " + phone
            );
        } else {
            alert("❌ " + (data.error || "ការកម្ម៉ង់មិនបានសម្រេច"));
        }

    } catch (error) {
        alert("❌ មិនអាចភ្ជាប់ទៅ Server បានទេ");
        console.error(error);
    }
}

</script>

</body>
</html>
