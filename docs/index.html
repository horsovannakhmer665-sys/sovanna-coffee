<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ហាងសុវណ្ណាលក់គ្រឿងកាហ្វេ</title>

<style>
body {
    margin: 0;
    font-family: Arial, "Noto Sans Khmer", sans-serif;
    background: #f5f5f5;
    color: #333;
}

header {
    background: #5b351f;
    color: white;
    padding: 25px;
    text-align: center;
}

header h1 {
    margin: 0;
    font-size: 30px;
}

header p {
    margin: 8px 0 0;
}

.search {
    text-align: center;
    padding: 20px;
}

.search input {
    width: 80%;
    max-width: 500px;
    padding: 14px;
    border: 1px solid #ccc;
    border-radius: 10px;
    font-size: 16px;
}

.products {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
    padding: 20px;
    max-width: 1200px;
    margin: auto;
}

.card {
    background: white;
    border-radius: 15px;
    overflow: hidden;
    box-shadow: 0 3px 10px rgba(0,0,0,0.1);
}

.card img {
    width: 100%;
    height: 200px;
    object-fit: cover;
}

.card-content {
    padding: 15px;
}

.card h2 {
    margin: 0 0 8px;
    font-size: 20px;
}

.category {
    color: #777;
    font-size: 14px;
}

.price {
    color: #b36b00;
    font-size: 20px;
    font-weight: bold;
    margin-top: 10px;
}

footer {
    margin-top: 30px;
    background: #333;
    color: white;
    text-align: center;
    padding: 20px;
}
</style>
</head>

<body>

<header>
    <h1>🏪 ហាងសុវណ្ណាលក់គ្រឿងកាហ្វេ</h1>
    <p>ទំនិញ និងតម្លៃរបស់ហាង</p>
</header>

<div class="search">
    <input type="text" id="search" placeholder="🔎 ស្វែងរកទំនិញ...">
</div>

<div class="products" id="products">

    <div class="card">
        <img src="images/coffee.jpg" alt="កាហ្វេ">
        <div class="card-content">
            <h2>កាហ្វេ</h2>
            <div class="category">គ្រឿងម្សៅ</div>
            <div class="price">25,000៛</div>
        </div>
    </div>

</div>

<footer>
    © 2026 ហាងសុវណ្ណាលក់គ្រឿងកាហ្វេ
</footer>

<script>
const search = document.getElementById("search");
const cards = document.querySelectorAll(".card");

search.addEventListener("input", function () {
    const text = search.value.toLowerCase();

    cards.forEach(card => {
        const name = card.innerText.toLowerCase();

        if (name.includes(text)) {
            card.style.display = "";
        } else {
            card.style.display = "none";
        }
    });
});
</script>

</body>
</html>
